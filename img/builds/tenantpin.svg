<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1 -1 36 42" width="36" height="42" role="img" aria-label="tenantpin">
  <!-- Rounded teardrop pin: three 17-radius arcs (near-circle head) plus one
       4-radius corner, rotated 315deg so the sharp corner points down. The
       viewBox is taller than the head so the rotated point (~y39) is fully
       contained. A centred circular hole is punched via fill-rule:evenodd so
       the mark reads as a "dot of presence" on any background.
       Colour = brand primary terracotta oklch(58% 0.15 35) ≈ #c25237. -->
  <path fill="#c25237" fill-rule="evenodd" transform="rotate(315 17 17)"
        d="M17 0
           A17 17 0 0 1 34 17
           V17
           A17 17 0 0 1 17 34
           H4
           A4 4 0 0 1 0 30
           V17
           A17 17 0 0 1 17 0
           Z
           M25 17
           A8 8 0 1 0 9 17
           A8 8 0 1 0 25 17
           Z"/>
</svg>
