<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;zoom:2;width:640px;height:400px;background:#fff;font:15px -apple-system,"Helvetica Neue",Arial,sans-serif;overflow:hidden}
.top{height:54px;border-bottom:1px solid #e5e5ea;background:#f7f7f9;display:flex;flex-direction:column;align-items:center;justify-content:center}
.av{width:26px;height:26px;border-radius:50%;background:linear-gradient(#a0a6b8,#7d8396);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;font-weight:700}
.top small{font-size:11px;color:#111;margin-top:2px}
.chat{padding:14px 18px;display:flex;flex-direction:column;gap:6px}
.m{max-width:62%;padding:8px 13px;border-radius:18px;line-height:1.35;opacity:0;transform:translateY(8px);animation:in .3s forwards}
.me{align-self:flex-end;background:#0a84ff;color:#fff;font-family:Menlo,monospace;font-size:13px}
.bot{align-self:flex-start;background:#e9e9eb;color:#111}
.dots{align-self:flex-start;background:#e9e9eb;border-radius:18px;padding:10px 14px;opacity:0;animation:in .2s forwards,out .2s forwards}
.dots i{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:#999}
@keyframes in{to{opacity:1;transform:none}}@keyframes out{to{opacity:0;height:0;padding:0;margin:-6px 0 0}}
b{font-weight:600}.s{color:#555;font-size:13px}
</style></head><body>
<div class="top"><div class="av">$?</div><small>What's This Charge?</small></div>
<div class="chat">
<div class="m me" style="animation-delay:.6s">SQ *BLUE BOTL 4155551234 CA</div>
<div class="dots" style="animation-delay:1.3s,2.9s"><i></i><i></i><i></i></div>
<div class="m bot" style="animation-delay:3.1s"><b>Blue Bottle Coffee</b><br>bluebottlecoffee.com<br><span class="s">Clues: Square payment (SQ *), "BLUE BOTL", 415 number, CA</span><br>Confidence: <b>high</b></div>
<div class="m me" style="animation-delay:5.2s">TST* JOES PIZZA NY</div>
<div class="dots" style="animation-delay:5.8s,7.2s"><i></i><i></i><i></i></div>
<div class="m bot" style="animation-delay:7.4s"><b>Joe's Pizza</b>, New York<br>Confidence: <b>high</b></div>
</div></body></html>
